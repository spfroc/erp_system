<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <alias>
    <family>宋体</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
      <family>Noto Sans CJK SC</family>
    </prefer>
  </alias>
  <alias>
    <family>SimSun</family>
    <prefer>
      <family>Noto Serif CJK SC</family>
    </prefer>
  </alias>
</fontconfig>
