[project]
name = "yicai-erp-backend"
version = "0.1.0"
description = "Django REST backend for Yicai ERP."
requires-python = ">=3.12"
dependencies = [
  "Django>=5.2,<6.1",
  "djangorestframework>=3.15",
  "django-cors-headers>=4.4",
  "PyMySQL>=1.1",
  "celery>=5.4",
  "redis>=5.0",
  "gunicorn>=23.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "factory-boy>=3.3",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]

[tool.ruff]
line-length = 100
target-version = "py312"
