    function kindTone(kind) {
      if (kind === "成交公告") return "gold";
      if (kind === "失败公告" || kind === "废标公告" || kind === "终止公告") return "coral";
      if (kind === "询比公告" || kind === "竞价公告") return "teal";
      if (kind && kind !== "采购公告") return "ink";
      return "";
    }

    function closeNoticeDetail() {
      noticeDetail = null;
      const backdrop = document.getElementById("notice-detail-backdrop");
      if (backdrop) backdrop.remove();
    }

    function openSourceUrl(url) {
      if (!url) return;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    function showNoticeDetail(detail) {
      closeNoticeDetail();
      noticeDetail = detail;
      const backdrop = document.createElement("div");
      backdrop.id = "notice-detail-backdrop";
      backdrop.className = "modal-backdrop";
      backdrop.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true">' +
        '<div class="modal-head"><div><h3></h3><p></p></div><button class="icon-button" type="button" aria-label="关闭">×</button></div>' +
        '<div class="modal-body">' +
        '<div class="detail-grid"></div>' +
        '<div class="modal-actions">' +
        '<button class="ghost" type="button" data-role="close">关闭</button>' +
        '<button class="primary" type="button" data-role="open-source">打开原文</button>' +
        "</div></div></div>";
      const meta = [detail.siteLabel, detail.noticeKind, formatDateTimeShanghai(detail.publishTime)].filter((part) => part && part !== "—").join(" · ");
      backdrop.querySelector("h3").textContent = detail.title || "公告详情";
      backdrop.querySelector(".modal-head p").textContent = meta || "—";
      const grid = backdrop.querySelector(".detail-grid");
      const fields = [
        ["项目编号", detail.projectCode],
        ["项目名称", detail.projectName],
        ["采购人", detail.buyerName],
        ["地区", detail.regionName],
        ["预算金额", detail.budgetAmount != null ? formatMoney(detail.budgetAmount) : ""],
        ["成交金额", detail.dealAmount != null ? formatMoney(detail.dealAmount) : ""],
        ["成交供应商", detail.dealSupplier],
        ["进度", detail.progressLabel],
        ["开始时间", detail.startTime ? formatDateTimeShanghai(detail.startTime, true) : ""],
        ["结束时间", detail.endTime ? formatDateTimeShanghai(detail.endTime, true) : ""],
      ];
      fields.forEach(([label, value]) => {
        if (value == null || value === "") return;
        const info = document.createElement("div");
        info.className = "info";
        info.innerHTML = "<span></span><strong></strong>";
        info.querySelector("span").textContent = label;
        info.querySelector("strong").textContent = String(value);
        grid.appendChild(info);
      });
      const contentHtml = String(detail.contentHtml || "").trim();
      const contentText = String(detail.contentText || detail.content || "").trim();
      if (contentHtml || contentText) {
        const block = document.createElement("div");
        block.className = "info wide notice-content-block";
        const label = document.createElement("span");
        label.textContent = "公告正文";
        block.appendChild(label);
        const body = document.createElement("div");
        body.className = contentHtml ? "notice-content-html" : "notice-content-text";
        if (contentHtml) {
          body.innerHTML = contentHtml
            .replace(/<(script|style|iframe|object|embed)[\s\S]*?<\/\1>/gi, "")
            .replace(/on[a-z]+\s*=\s*(['"]).*?\1/gi, "")
            .replace(/on[a-z]+\s*=\s*[^\s>]+/gi, "");
        } else {
          body.textContent = contentText.slice(0, 4000);
        }
        block.appendChild(body);
        grid.appendChild(block);
      }
      const sourceBtn = backdrop.querySelector("[data-role=open-source]");
      if (!detail.sourceUrl) {
        sourceBtn.disabled = true;
        sourceBtn.textContent = "暂无原文链接";
      } else {
        sourceBtn.onclick = () => openSourceUrl(detail.sourceUrl);
      }
      backdrop.querySelector("[data-role=close]").onclick = closeNoticeDetail;
      backdrop.querySelector(".icon-button").onclick = closeNoticeDetail;
      backdrop.addEventListener("click", (event) => {
        if (event.target === backdrop) closeNoticeDetail();
      });
      document.body.appendChild(backdrop);
    }

    async function openNoticeDetail(id) {
      try {
        const detail = await api("/api/portal/notices/" + id + "/");
        showNoticeDetail(detail);
      } catch (error) {
        window.alert(error.message || "加载详情失败");
      }
    }

    async function openMessageDetail(messageId) {
      try {
        const body = await api("/api/portal/messages/" + messageId + "/", { method: "POST", body: "{}" });
        if (body.notice) {
          showNoticeDetail(body.notice);
          return;
        }
        window.alert(body.noticeError || "暂无法打开公告详情");
      } catch (error) {
        window.alert(error.message || "加载消息失败");
      }
    }

    function syncMessageFiltersFromSubscription(sub) {
      const keywords = subscriptionKeywords(sub);
      const cities = subscriptionCities(sub);
      if (!messageQuery.filtersReady) {
        messageQuery.keyword = "";
        messageQuery.region = "";
        messageQuery.filtersReady = true;
      }
      if (messageQuery.keyword && !keywords.includes(messageQuery.keyword)) messageQuery.keyword = "";
      if (messageQuery.region && !cities.includes(messageQuery.region)) messageQuery.region = "";
      return { keywords, cities, categories: subscriptionNoticeCategories(sub), orgTypes: sub?.orgTypes || [] };
    }

    async function renderMessages(panel) {
      const requestId = ++messageRequest;
      const subMeta = syncMessageFiltersFromSubscription(me?.subscription);
      const params = new URLSearchParams({
        page: String(messageQuery.page),
        page_size: "20",
      });
      if (messageQuery.unread) params.set("unread", "1");
      if (messageQuery.keyword) params.set("keyword", messageQuery.keyword);
      if (messageQuery.region) params.set("region", messageQuery.region);
      if (!panel.querySelector(".message-list")) {
        panel.innerHTML = '<p class="panel-loading">正在加载我的订阅…</p>';
      }
      const body = await api("/api/portal/messages/?" + params.toString());
      if (requestId !== messageRequest) return;
      if (body.subscription) {
        Object.assign(subMeta, syncMessageFiltersFromSubscription(body.subscription));
      }

      let shell = panel.querySelector(".message-shell");
      let head = panel.querySelector(".message-head");
      let subBar = panel.querySelector(".message-sub-bar");
      let toolbar = panel.querySelector(".message-toolbar");
      let list = panel.querySelector(".message-list");
      let pager = panel.querySelector(".pager");
      if (!shell || !head || !toolbar || !list || !pager) {
        panel.innerHTML = "";
        shell = document.createElement("div");
        shell.className = "message-shell";
        head = document.createElement("div");
        head.className = "message-head";
        head.innerHTML =
          "<div><h2>我的订阅</h2><p class=\"muted\">按你的商机订阅条件筛选推送记录</p></div>" +
          '<div class="message-head-actions">' +
          '<button type="button" class="primary" data-role="open-subscription">订阅商机</button>' +
          "</div>";
        subBar = document.createElement("div");
        subBar.className = "message-sub-bar";
        toolbar = document.createElement("div");
        toolbar.className = "message-toolbar";
        toolbar.innerHTML =
          '<div class="message-toolbar-row">' +
          '<p class="message-summary muted"></p>' +
          '<div class="message-tools">' +
          '<div class="message-layout-toggle" role="group" aria-label="排列方式">' +
          '<button type="button" data-layout="list">列表</button>' +
          '<button type="button" data-layout="grid">卡片</button>' +
          "</div>" +
          '<label class="check-row"><input name="unread" type="checkbox" /> 仅未读</label>' +
          '<button class="ghost" type="button" data-role="refresh">刷新</button>' +
          "</div>" +
          "</div>" +
          '<div class="message-toolbar-row">' +
          '<div class="message-filters">' +
          '<label>关键词<select name="keyword"><option value="">全部关键词</option></select></label>' +
          '<label>地市<select name="region"><option value="">全部地市</option></select></label>' +
          "</div>" +
          "</div>";
        list = document.createElement("div");
        list.className = "list-card message-list";
        pager = document.createElement("div");
        pager.className = "pager";
        shell.appendChild(head);
        shell.appendChild(subBar);
        shell.appendChild(toolbar);
        panel.appendChild(shell);
        panel.appendChild(list);
        panel.appendChild(pager);
        head.querySelector("[data-role=open-subscription]").onclick = () => openTab("subscription");
        toolbar.querySelector("[name=keyword]").onchange = (event) => {
          messageQuery.keyword = String(event.target.value || "").trim();
          messageQuery.page = 1;
          renderMessages(panel);
        };
        toolbar.querySelector("[name=region]").onchange = (event) => {
          messageQuery.region = String(event.target.value || "").trim();
          messageQuery.page = 1;
          renderMessages(panel);
        };
        toolbar.querySelector("[name=unread]").onchange = (event) => {
          messageQuery.unread = Boolean(event.target.checked);
          messageQuery.page = 1;
          renderMessages(panel);
        };
        toolbar.querySelector("[data-role=refresh]").onclick = () => renderMessages(panel);
        toolbar.querySelectorAll("[data-layout]").forEach((btn) => {
          btn.onclick = () => {
            messageQuery.layout = btn.getAttribute("data-layout") === "grid" ? "grid" : "list";
            localStorage.setItem("portal_message_layout", messageQuery.layout);
            list.classList.toggle("is-grid", messageQuery.layout === "grid");
            toolbar.querySelectorAll("[data-layout]").forEach((item) => {
              item.classList.toggle("active", item.getAttribute("data-layout") === messageQuery.layout);
            });
          };
        });
      }
      if (!subBar) subBar = panel.querySelector(".message-sub-bar");

      const keywordSelect = toolbar.querySelector("[name=keyword]");
      const regionSelect = toolbar.querySelector("[name=region]");
      const fillSelect = (select, items, emptyLabel, current) => {
        const values = items.slice();
        select.innerHTML = "";
        const empty = document.createElement("option");
        empty.value = "";
        empty.textContent = emptyLabel;
        select.appendChild(empty);
        values.forEach((item) => {
          const opt = document.createElement("option");
          opt.value = item;
          opt.textContent = item;
          select.appendChild(opt);
        });
        select.value = values.includes(current) ? current : "";
        select.disabled = !values.length;
      };
      fillSelect(keywordSelect, subMeta.keywords, "全部关键词", messageQuery.keyword);
      fillSelect(regionSelect, subMeta.cities, "全部地市", messageQuery.region);
      messageQuery.keyword = keywordSelect.value;
      messageQuery.region = regionSelect.value;

      const chips = [];
      subMeta.keywords.forEach((item) => chips.push(item));
      subMeta.cities.forEach((item) => chips.push(item));
      (subMeta.categories || []).forEach((item) => chips.push(item));
      (subMeta.orgTypes || []).forEach((item) => chips.push(item));
      subBar.innerHTML = "";
      if (!chips.length) {
        subBar.innerHTML = '<span>尚未设置订阅条件，请先前往「订阅商机」配置。</span>';
      } else {
        const label = document.createElement("span");
        label.textContent = "当前订阅：";
        subBar.appendChild(label);
        chips.slice(0, 12).forEach((text) => {
          const chip = document.createElement("span");
          chip.className = "summary-chip";
          chip.textContent = text;
          subBar.appendChild(chip);
        });
        if (chips.length > 12) {
          const more = document.createElement("span");
          more.textContent = "等 " + chips.length + " 项";
          subBar.appendChild(more);
        }
      }

      toolbar.querySelector("[name=unread]").checked = Boolean(messageQuery.unread);
      list.classList.toggle("is-grid", messageQuery.layout === "grid");
      toolbar.querySelectorAll("[data-layout]").forEach((item) => {
        item.classList.toggle("active", item.getAttribute("data-layout") === messageQuery.layout);
      });
      setMessageBadge(body.unreadTotal || 0);
      const summary = toolbar.querySelector(".message-summary");
      if (summary) {
        const filteredUnread = body.unreadFiltered != null ? body.unreadFiltered : body.unreadTotal || 0;
        summary.innerHTML =
          "共 <strong></strong> 条，未读 <em></em> 条<span class='message-hint'> · 点卡片查看详情</span>";
        summary.querySelector("strong").textContent = String(body.total || 0);
        summary.querySelector("em").textContent = String(filteredUnread);
      }

      list.innerHTML = "";
      const hasFilter = Boolean(messageQuery.keyword || messageQuery.region || messageQuery.unread);
      if (!body.items || !body.items.length) {
        list.innerHTML = hasFilter
          ? '<p class="empty">没有匹配的订阅记录。</p>'
          : '<p class="empty">暂无订阅推送。</p>';
      } else {
        body.items.forEach((item) => {
          const article = document.createElement("article");
          article.className = "message-item" + (item.isRead ? "" : " is-unread");
          article.innerHTML =
            '<span class="message-dot" aria-hidden="true"></span>' +
            '<div class="message-body"><h3></h3><div class="message-meta"></div></div>' +
            '<div class="message-side">' +
            '<button class="ghost" type="button" data-role="detail">查看公告</button>' +
            "</div>";
          const terms = item.matchedKeywords || [];
          article.querySelector("h3").innerHTML = highlightText(item.title || "未命名公告", terms);
          const meta = article.querySelector(".message-meta");
          const metaChips = [
            { text: item.isRead ? "已读" : "未读", className: item.isRead ? "status-read" : "status-unread" },
            { text: item.siteLabel },
            { text: item.buyerName, highlight: true },
            { text: item.regionName, highlight: true },
            { text: item.digestDate },
            { text: formatDateTimeShanghai(item.createdAt) },
          ].filter((chip) => chip.text && chip.text !== "—");
          metaChips.forEach((chip) => {
            const span = document.createElement("span");
            if (chip.className) span.className = chip.className;
            if (chip.highlight) span.innerHTML = highlightText(chip.text, terms);
            else span.textContent = chip.text;
            meta.appendChild(span);
          });
          (terms || []).slice(0, 4).forEach((term) => {
            const span = document.createElement("span");
            span.className = "status-unread";
            span.textContent = "命中：" + term;
            meta.appendChild(span);
          });
          const open = (event) => {
            if (event) event.stopPropagation();
            void openMessageDetail(item.id).then(() => {
              if (!item.isRead) setMessageBadge(Math.max(0, unreadBadgeCount - 1));
              return renderMessages(panel);
            });
          };
          article.onclick = open;
          article.querySelector("[data-role=detail]").onclick = open;
          list.appendChild(article);
        });
      }

      fillPortalListPager(pager, {
        page: body.page || messageQuery.page || 1,
        total: body.total || 0,
        pageSize: body.page_size || 20,
        onPageChange: (next) => {
          messageQuery.page = next;
          renderMessages(panel);
        },
      });
    }

    let noticeCountdownTimer = 0;

    function refreshNoticeCountdowns(root) {
      (root || document).querySelectorAll(".portal-notice-card[data-countdown]").forEach((card) => {
        const item = {
          title: card.dataset.title || "",
          noticeKind: card.dataset.noticeKind || "",
          progressStatus: card.dataset.progressStatus || "",
          progressLabel: card.dataset.progressLabel || "",
          startTime: card.dataset.startTime || "",
          endTime: card.dataset.endTime || "",
        };
        const clock = noticeCountdownInfo(item);
        const status = card.querySelector(".portal-notice-status");
        const kind = card.querySelector(".kind");
        const countdown = card.querySelector(".countdown");
        if (status) status.className = "portal-notice-status tone-" + clock.tone;
        if (kind) kind.textContent = clock.label;
        if (countdown) countdown.textContent = clock.text || "";
      });
    }

    function ensureNoticeCountdownTicker() {
      if (noticeCountdownTimer) return;
      noticeCountdownTimer = window.setInterval(() => {
        const list = document.querySelector(".notice-card-list");
        if (!list) return;
        refreshNoticeCountdowns(list);
      }, 30000);
    }

    function noticeKindPrefix(item) {
      const kind = String(item.noticeKind || "").trim();
      if (!kind) return "";
      if (/意向/.test(kind)) return "【采购意向】";
      if (/成交|结果/.test(kind)) return "【结果公告】";
      return "【平台采购公告】";
    }

    function fillNoticeList(list, body) {
      list.innerHTML = "";
      if (!body.items.length) {
        list.innerHTML = '<p class="empty">没有符合条件的公告。</p>';
        return;
      }
      body.items.forEach((item) => {
        const article = document.createElement("article");
        article.className = "portal-notice-card";
        article.dataset.countdown = "1";
        article.dataset.title = item.title || "";
        article.dataset.noticeKind = item.noticeKind || "";
        article.dataset.progressStatus = item.progressStatus || "";
        article.dataset.progressLabel = item.progressLabel || "";
        article.dataset.startTime = item.startTime || "";
        article.dataset.endTime = item.endTime || "";
        const amount =
          item.budgetAmount != null && item.budgetAmount !== ""
            ? "¥" + Number(item.budgetAmount).toLocaleString("zh-CN")
            : item.dealAmount != null && item.dealAmount !== ""
              ? "¥" + Number(item.dealAmount).toLocaleString("zh-CN")
              : "—";
        const method = item.procurementMode || item.noticeKind || "—";
        const clock = noticeCountdownInfo(item);
        const prefix = noticeKindPrefix(item);
        article.innerHTML =
          "<h3></h3>" +
          '<div class="portal-notice-status tone-' + clock.tone + '"><strong class="kind"></strong><em class="countdown"></em></div>' +
          '<div class="portal-notice-fields">' +
          "<div>采购预算：<b></b></div>" +
          "<div data-role='start'></div>" +
          "<div data-role='end'></div>" +
          "<div data-role='method'></div>" +
          "<div data-role='buyer'></div>" +
          "</div>" +
          '<div class="portal-notice-meta"></div>' +
          '<div class="portal-notice-actions">' +
          '<button class="ghost" type="button" data-role="detail">查看详情</button>' +
          '<button class="ghost" type="button" data-role="source">原文</button>' +
          "</div>";
        const titleEl = article.querySelector("h3");
        titleEl.innerHTML = "";
        if (prefix) {
          const mark = document.createElement("span");
          mark.className = "notice-kind-prefix";
          mark.textContent = prefix;
          titleEl.appendChild(mark);
        }
        titleEl.appendChild(document.createTextNode(item.title || "未命名公告"));
        article.querySelector(".kind").textContent = clock.label;
        article.querySelector(".portal-notice-status .countdown").textContent = clock.text || "";
        article.querySelector(".portal-notice-fields b").textContent = amount;
        article.querySelector("[data-role=start]").textContent = "开始时间：" + formatDateTimeShanghai(item.startTime);
        article.querySelector("[data-role=end]").textContent = "结束时间：" + formatDateTimeShanghai(item.endTime);
        article.querySelector("[data-role=method]").textContent = "采购方式：" + method;
        article.querySelector("[data-role=buyer]").textContent = "采购单位：" + (item.buyerName || "—");
        const meta = article.querySelector(".portal-notice-meta");
        [item.siteLabel, method, item.regionName]
          .filter((part) => part && part !== "—")
          .forEach((text) => {
            const span = document.createElement("span");
            span.textContent = text;
            meta.appendChild(span);
          });
        const open = () => void openNoticeDetail(item.id);
        article.querySelector("h3").onclick = open;
        article.querySelector("[data-role=detail]").onclick = open;
        const sourceBtn = article.querySelector("[data-role=source]");
        if (!item.sourceUrl) {
          sourceBtn.disabled = true;
          sourceBtn.style.opacity = "0.45";
        } else {
          sourceBtn.onclick = (event) => {
            event.stopPropagation();
            openSourceUrl(item.sourceUrl);
          };
        }
        list.appendChild(article);
      });
      ensureNoticeCountdownTicker();
    }

    function fillNoticePager(pager, panel, body) {
      fillPortalListPager(pager, {
        page: body.page || noticeQuery.page || 1,
        total: body.total || 0,
        pageSize: body.page_size || 20,
        onPageChange: (next) => {
          noticeQuery.page = next;
          renderNotices(panel);
        },
      });
    }

    function syncNoticeUpsell(panel, body) {
      let box = panel.querySelector(".notice-upsell");
      const need = Boolean(body.lookbackClamped) || Boolean(body.dealNoticeBlocked);
      if (!need) {
        if (box) box.remove();
        return;
      }
      if (!box) {
        box = document.createElement("div");
        box.className = "notice-upsell";
        const toolbar = panel.querySelector(".toolbar");
        if (toolbar && toolbar.nextSibling) panel.insertBefore(box, toolbar.nextSibling);
        else panel.prepend(box);
      }
      const months = body.maxLookbackMonths || 6;
      const parts = [];
      if (body.lookbackClamped) {
        parts.push("普通客户最多可查近 " + months + " 个月公告；更早数据需开通<strong>数据分析服务</strong>。");
      }
      if (body.dealNoticeBlocked) {
        parts.push("成交/结果类公告仅对开通<strong>数据分析服务</strong>的客户开放。");
      }
      if (!parts.length) {
        parts.push("开通<strong>数据分析服务</strong>后可查询更长周期与成交公告。");
      }
      box.innerHTML = parts.join(" ");
    }

    async function renderNotices(panel) {
      const requestId = ++noticeRequest;
      noticeQuery.publishDateFrom = clampNoticePublishFrom(noticeQuery.publishDateFrom);
      const params = new URLSearchParams({
        page: String(noticeQuery.page),
        page_size: "20",
        search: noticeQuery.search,
        siteId: noticeQuery.siteId,
        noticeKind: noticeQuery.noticeKind,
        progress: noticeQuery.progress,
        regionName: noticeQuery.regionName,
        projectCode: noticeQuery.projectCode,
        projectName: noticeQuery.projectName,
        buyerName: noticeQuery.buyerName,
        publishDateFrom: noticeQuery.publishDateFrom,
      });
      if (noticeQuery.publishDateTo) params.set("publishDateTo", noticeQuery.publishDateTo);
      if (!panel.querySelector(".notice-card-list")) {
        panel.innerHTML = '<p class="panel-loading">正在加载公告列表…</p>';
      }
      const body = await api("/api/portal/notices/?" + params.toString());
      if (requestId !== noticeRequest) return;
      if (body.publishDateFrom) noticeQuery.publishDateFrom = body.publishDateFrom;
      if (body.publishDateTo != null && body.publishDateTo !== undefined) {
        // 仅当服务端回写了结束日时同步；空串表示未限制结束日
        if (body.publishDateTo) noticeQuery.publishDateTo = body.publishDateTo;

      let toolbar = panel.querySelector(".toolbar");
      let list = panel.querySelector(".notice-card-list");
      let pager = panel.querySelector(".pager");
      if (!toolbar || !list || !pager) {
        panel.innerHTML = "";
        toolbar = document.createElement("div");
        toolbar.className = "toolbar";
        toolbar.innerHTML =
          '<label>搜索<input name="search" placeholder="标题、项目、采购人" /></label>' +
          '<label>平台<select name="siteId"><option value="">全部</option></select></label>' +
          '<label>类型<select name="noticeKind"><option value="">全部</option></select></label>' +
          '<label>进度<select name="progress"><option value="">全部</option><option value="ongoing">进行中</option><option value="upcoming">未开始</option><option value="ended">已截止</option></select></label>' +
          '<label>区域<select name="regionName"><option value="">全部地市</option></select></label>' +
          '<label>项目编号<input name="projectCode" /></label>' +
          '<label>项目名称<input name="projectName" /></label>' +
          '<label>采购单位<input name="buyerName" /></label>' +
          '<label>发布开始<input name="publishDateFrom" class="date-input" type="text" data-datepicker placeholder="yyyy-mm-dd" maxlength="10" autocomplete="off" /></label>' +
          '<label>发布结束<input name="publishDateTo" class="date-input" type="text" data-datepicker placeholder="yyyy-mm-dd" maxlength="10" autocomplete="off" /></label>' +
          '<div class="toolbar-actions">' +
          '<button class="ghost" type="button" data-role="apply">查询</button>' +
          '<button class="ghost" type="button" data-role="reset">重置</button>' +
          "</div>";
        const bindText = (name, key, debounce) => {
          const input = toolbar.querySelector("[name=" + name + "]");
          input.value = noticeQuery[key] || "";
          if (!debounce) {
            input.onchange = () => {
              noticeQuery[key] = input.value.trim();
              noticeQuery.page = 1;
              renderNotices(panel);
            };
            return;
          }
          input.oninput = (event) => {
            window.clearTimeout(noticeSearchTimer);
            const value = event.target.value.trim();
            noticeSearchTimer = window.setTimeout(() => {
              if (noticeQuery[key] === value) return;
              noticeQuery[key] = value;
              noticeQuery.page = 1;
              renderNotices(panel);
            }, 300);
          };
        };
        bindText("search", "search", true);
        bindText("projectCode", "projectCode", true);
        bindText("projectName", "projectName", true);
        bindText("buyerName", "buyerName", true);
        const siteSelect = toolbar.querySelector("[name=siteId]");
        (body.sites || []).forEach((site) => {
          const option = document.createElement("option");
          option.value = site.id;
          option.textContent = site.label;
          siteSelect.appendChild(option);
        });
        siteSelect.value = noticeQuery.siteId;
        siteSelect.onchange = () => {
          noticeQuery.siteId = siteSelect.value;
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        const kindSelect = toolbar.querySelector("[name=noticeKind]");
        (body.noticeKinds || []).forEach((kind) => {
          const option = document.createElement("option");
          option.value = kind;
          option.textContent = kind;
          kindSelect.appendChild(option);
        });
        kindSelect.value = noticeQuery.noticeKind;
        kindSelect.onchange = () => {
          noticeQuery.noticeKind = kindSelect.value;
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        const progressSelect = toolbar.querySelector("[name=progress]");
        progressSelect.value = noticeQuery.progress;
        progressSelect.onchange = () => {
          noticeQuery.progress = progressSelect.value;
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        const regionSelect = toolbar.querySelector("[name=regionName]");
        const regionOptions = body.regions && body.regions.length ? body.regions : SHANDONG_CITIES;
        regionOptions.forEach((city) => {
          const option = document.createElement("option");
          option.value = city;
          option.textContent = /市$/.test(city) ? city : city + "市";
          regionSelect.appendChild(option);
        });
        regionSelect.value = noticeQuery.regionName || "";

          noticeQuery.regionName = regionSelect.value || "";
          noticeQuery.page = 1;
          renderNotices(panel);

        const fromInput = toolbar.querySelector("[name=publishDateFrom]");
        const toInput = toolbar.querySelector("[name=publishDateTo]");

        if (window.ycDatePicker) {
          window.ycDatePicker.bind(fromInput);
          window.ycDatePicker.bind(toInput);
        }
        toolbar.querySelector("[data-role=apply]").onclick = () => {
          noticeQuery.publishDateFrom = clampNoticePublishFrom(fromInput.value);
          noticeQuery.publishDateTo = normalizeYmd(toInput.value) || formatYmd(new Date());
          fromInput.value = noticeQuery.publishDateFrom;
          toInput.value = noticeQuery.publishDateTo;
          if (fromInput._flatpickr) fromInput._flatpickr.setDate(noticeQuery.publishDateFrom || "", false);
          if (toInput._flatpickr) toInput._flatpickr.setDate(noticeQuery.publishDateTo || "", false);
          noticeQuery.regionName = toolbar.querySelector("[name=regionName]").value.trim();
          noticeQuery.projectCode = toolbar.querySelector("[name=projectCode]").value.trim();
          noticeQuery.projectName = toolbar.querySelector("[name=projectName]").value.trim();
          noticeQuery.buyerName = toolbar.querySelector("[name=buyerName]").value.trim();
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        toolbar.querySelector("[data-role=reset]").onclick = () => {
          noticeQuery = defaultNoticeQuery();
          renderNotices(panel);
        };
        list = document.createElement("div");
        list.className = "notice-card-list";
        pager = document.createElement("div");
        pager.className = "pager";
        panel.appendChild(toolbar);
        panel.appendChild(list);
        panel.appendChild(pager);
      } else {
        toolbar.querySelector("[name=publishDateFrom]").value = noticeQuery.publishDateFrom;
        toolbar.querySelector("[name=publishDateTo]").value = noticeQuery.publishDateTo;
        toolbar.querySelector("[name=progress]").value = noticeQuery.progress;
        const regionSelect = toolbar.querySelector("[name=regionName]");
        if (regionSelect) regionSelect.value = noticeQuery.regionName || "";
        const kindSelect = toolbar.querySelector("[name=noticeKind]");
        if (kindSelect && body.noticeKinds) {
          const current = new Set(Array.from(kindSelect.options).map((opt) => opt.value).filter(Boolean));
          body.noticeKinds.forEach((kind) => {
            if (current.has(kind)) return;
            const option = document.createElement("option");
            option.value = kind;
            option.textContent = kind;
            kindSelect.appendChild(option);
          });
          kindSelect.value = noticeQuery.noticeKind;
        }
      }
      syncNoticeUpsell(panel, body);
      fillNoticeList(list, body);
      fillNoticePager(pager, panel, body);
    }

        </div>
        <p class="error" id="sub-msg"></p>
      `;
      panel.appendChild(card);

      const selectedCities = new Set(subscriptionCities(me.subscription));
      const selectedOrgTypes = new Set(me.subscription?.orgTypes || []);
      const selectedNoticeCategories = new Set(subscriptionNoticeCategories(me.subscription));
      const keywords = subscriptionKeywords(me.subscription);
      let pushTimes = subscriptionPushTimes(me.subscription);
      card.enabled.checked = Boolean(me.subscription?.enabled);

      const statusEl = card.querySelector("#wechat-status");
      const actionsEl = card.querySelector("#wechat-actions");
      const msgEl = card.querySelector("#sub-msg");
      const summaryEl = card.querySelector("#sub-summary");
      const tabsEl = card.querySelector("#sub-tabs");
      const subBody = card.querySelector("#sub-body");
      const subGate = card.querySelector("#sub-gate");
      const bindStatus = readWechatBindStatus();
      if (bindStatus === "ok") msgEl.textContent = "微信绑定成功。";
      else if (bindStatus === "fail") msgEl.textContent = "微信绑定失败，请重试。";
      else if (bindStatus === "conflict") msgEl.textContent = "该微信已绑定其他账号。";

      const tabDefs = [
        { id: "keywords", label: "关键词" },
        { id: "regions", label: "地区" },
        { id: "kinds", label: "公告类型" },
        { id: "orgs", label: "单位类型" },
        { id: "push", label: "推送设置" },
      ];
      let activeTab = "keywords";

      function tabCount(id) {
        if (id === "keywords") return keywords.length;
        if (id === "regions") return selectedCities.size;
        if (id === "kinds") return selectedNoticeCategories.size;
        if (id === "orgs") return selectedOrgTypes.size;
        if (id === "push") return (card.enabled.checked ? 1 : 0) + pushTimes.length;
        return 0;
      }

      function appendSummaryRow(container, label, values) {
        const row = document.createElement("div");
        row.className = "subscription-summary-row";
        row.innerHTML = "<dt></dt><dd></dd>";
        row.querySelector("dt").textContent = label;
        const dd = row.querySelector("dd");
        if (!values.length) {
          dd.innerHTML = '<span class="summary-empty">未设置</span>';
        } else {
          values.forEach((value) => {
            const chip = document.createElement("span");
            chip.className = "summary-chip";
            chip.textContent = value;
            dd.appendChild(chip);
          });
        }
        container.appendChild(row);
      }

      function refreshSummary() {
        const parts = [];
        if (keywords.length) parts.push("关键词 " + keywords.length + " 个");
        if (selectedCities.size) parts.push("地市 " + selectedCities.size + " 个");
        if (selectedNoticeCategories.size) parts.push("类型 " + [...selectedNoticeCategories].join("/"));
        if (selectedOrgTypes.size) parts.push("单位类型 " + selectedOrgTypes.size + " 个");
        parts.push(card.enabled.checked ? "推送已开启" : "推送未开启");
        if (pushTimes.length) parts.push("时刻 " + pushTimes.join("、"));
        summaryEl.querySelector("[data-role=brief]").textContent = parts.join(" · ");
        summaryEl.querySelector("[data-role=toggle]").textContent = summaryEl.open ? "收起细节" : "展开细节";
        const detail = summaryEl.querySelector("[data-role=detail]");
        detail.innerHTML = "";
        appendSummaryRow(detail, "关键词", keywords.slice());
        appendSummaryRow(detail, "地区", [...selectedCities]);
        appendSummaryRow(detail, "公告类型", [...selectedNoticeCategories]);
        appendSummaryRow(detail, "单位类型", [...selectedOrgTypes]);
        appendSummaryRow(detail, "推送时刻", pushTimes.slice());
        appendSummaryRow(detail, "推送", [card.enabled.checked ? "已开启" : "未开启"]);
      }

      summaryEl.addEventListener("toggle", () => {
        const toggle = summaryEl.querySelector("[data-role=toggle]");
        if (toggle) toggle.textContent = summaryEl.open ? "收起细节" : "展开细节";
      });

      function renderTabs() {
        tabsEl.innerHTML = "";
        tabDefs.forEach((tab) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = activeTab === tab.id ? "active" : "";
          const count = tabCount(tab.id);
          btn.textContent = count ? tab.label + " (" + count + ")" : tab.label;
          btn.onclick = () => {
            activeTab = tab.id;
            card.querySelectorAll(".subscription-tab-panel").forEach((pane) => {
              pane.classList.toggle("active", pane.getAttribute("data-tab") === activeTab);
            });
            renderTabs();
          };
          tabsEl.appendChild(btn);
        });
        card.querySelectorAll(".subscription-tab-panel").forEach((pane) => {
          pane.classList.toggle("active", pane.getAttribute("data-tab") === activeTab);
        });
        refreshSummary();
      }

      function renderKeywordChips() {
        const box = card.querySelector("#keyword-chips");
        box.innerHTML = "";
        if (!keywords.length) {
          box.innerHTML = '<span class="muted">尚未添加关键词</span>';
          return;
        }
        keywords.forEach((word, index) => {
          const chip = document.createElement("span");
          chip.className = "keyword-chip";
          chip.innerHTML = "<span></span><button type='button' aria-label='删除'>×</button>";
          chip.querySelector("span").textContent = word;
          chip.querySelector("button").onclick = () => {
            keywords.splice(index, 1);
            renderKeywordChips();
            renderTabs();
          };
          box.appendChild(chip);
        });
      }

      function addKeyword() {
        const input = card.keywordInput;
        const word = String(input.value || "").trim();
        msgEl.textContent = "";
        if (!word) {
          msgEl.textContent = "请输入关键词。";
          return;
        }
        if (/[,，;；|\s]/.test(word)) {
          msgEl.textContent = "请一次只添加一个关键词，不要包含空格或逗号。";
          return;
        }
        if (keywords.includes(word)) {
          msgEl.textContent = "该关键词已存在。";
          return;
        }
        if (keywords.length >= 20) {
          msgEl.textContent = "关键词最多 20 个。";
          return;
        }
        keywords.push(word);
        input.value = "";
        renderKeywordChips();
        renderTabs();
      }

      function renderCityChips(cities) {
        renderChipGroup(card.querySelector("#city-chips"), cities || SHANDONG_CITIES, [...selectedCities], (item) => {

      function fillTimeSelect(select, values, current) {
        select.innerHTML = "";
        values.forEach((value) => {
          const opt = document.createElement("option");
          opt.value = value;
          opt.textContent = value;
          select.appendChild(opt);
        });
        select.value = values.includes(current) ? current : values[0];
      }

      function readPushTimeRow(row) {
        const hour = row.querySelector("[data-role=hour]")?.value || "18";
        const minute = row.querySelector("[data-role=minute]")?.value || "00";
        return hour + ":" + minute;
      }

      function syncPushTimesFromRows() {
        const rows = Array.from(card.querySelectorAll(".push-time-row"));
        const next = rows.map((row) => readPushTimeRow(row));
        const checked = validateSubscriptionPushTimes(next);
        pushTimes = checked.times;
        msgEl.textContent = checked.error || "";
        return checked;
      }

      function renderPushTimes() {
        const box = card.querySelector("#push-time-list");
        box.innerHTML = "";
        const hourValues = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, "0"));
        pushTimes.forEach((time, index) => {
          const parts = String(time || "18:00").split(":");
          let hour = String(parts[0] || "18").padStart(2, "0");
          let minute = String(parts[1] || "00").padStart(2, "0");
          const minuteValues = Array.from({ length: 12 }, (_, i) => String(i * 5).padStart(2, "0"));
          if (!minuteValues.includes(minute)) minuteValues.push(minute);
          minuteValues.sort();
          if (!hourValues.includes(hour)) hour = "18";

          const row = document.createElement("div");
          row.className = "push-time-row";
          row.innerHTML =
            '<span class="push-time-label">推送时刻</span>' +
            '<div class="push-time-fields">' +
            '<select data-role="hour" aria-label="小时"></select>' +
            '<span class="push-time-sep">:</span>' +
            '<select data-role="minute" aria-label="分钟"></select>' +
            "</div>" +
            '<button type="button" class="ghost" data-role="remove">删除</button>';
          const hourSelect = row.querySelector("[data-role=hour]");
          const minuteSelect = row.querySelector("[data-role=minute]");
          fillTimeSelect(hourSelect, hourValues, hour);
          fillTimeSelect(minuteSelect, minuteValues, minute);
          const onChange = () => {
            const checked = syncPushTimesFromRows();
            if (checked.error) {
              renderPushTimes();
              renderTabs();
              return;
            }
            pushTimes[index] = readPushTimeRow(row);
            pushTimes = validateSubscriptionPushTimes(pushTimes).times;
            renderTabs();
          };
          hourSelect.onchange = onChange;
          minuteSelect.onchange = onChange;
          row.querySelector("[data-role=remove]").onclick = () => {
            if (pushTimes.length <= 1) {
              msgEl.textContent = "至少保留一个推送时刻。";
              return;
            }
            pushTimes.splice(index, 1);
            renderPushTimes();
            renderTabs();
          };
          box.appendChild(row);
        });
        const addBtn = card.querySelector("[data-role=add-push-time]");
        if (addBtn) addBtn.disabled = pushTimes.length >= 5;
      }

      async function openBindQrModal(options) {
        stopWechatBindPoll();
        const backdrop = document.createElement("div");
        backdrop.className = "modal-backdrop";
        backdrop.innerHTML =
          '<div class="modal bind-qr-modal" role="dialog" aria-modal="true">' +
          '<div class="modal-head"><h3>扫码绑定微信</h3><button type="button" class="icon-button" data-role="close" aria-label="关闭">×</button></div>' +
          '<div class="modal-body">' +
          '<p class="muted">请使用微信扫一扫，关注服务号并授权绑定当前账号。</p>' +
          '<div class="qr-box"><img alt="绑定二维码" /><div class="qr-mask">正在生成二维码…</div></div>' +
          '<p class="muted" data-role="hint">二维码约 3 分钟有效</p>' +
          '<p class="error" data-role="err"></p>' +
          '<div class="row-actions" style="justify-content:center"><button type="button" class="ghost" data-role="refresh">刷新二维码</button></div>' +
          "</div></div>";
        document.body.appendChild(backdrop);
        const qrImg = backdrop.querySelector("img");
        const mask = backdrop.querySelector(".qr-mask");
        const errEl = backdrop.querySelector("[data-role=err]");
        const hintEl = backdrop.querySelector("[data-role=hint]");
        const close = () => {
          stopWechatBindPoll();
          backdrop.remove();
        };
        backdrop.addEventListener("click", (event) => {
          if (event.target === backdrop) close();
        });
        backdrop.querySelector("[data-role=close]").onclick = close;

        async function startBindQr() {
          stopWechatBindPoll();
          errEl.textContent = "";
          mask.hidden = false;
          mask.textContent = "正在生成二维码…";
          try {
            const body = await api("/api/portal/wechat/scan-bind/start/", { method: "POST", body: "{}" });
            wechatBindTicket = body.ticket || "";
            if (!wechatBindTicket || !body.qrImageUrl) throw new Error("二维码生成失败");
            qrImg.onload = () => { mask.hidden = true; };
            qrImg.onerror = () => { mask.hidden = false; mask.textContent = "二维码加载失败"; };
            qrImg.src = body.qrImageUrl;
            const expiresIn = Math.max(30, Number(body.expiresIn) || 180) * 1000;
            const startedAt = Date.now();
            wechatBindPollTimer = window.setInterval(async () => {
              if (!wechatBindTicket) return;
              if (Date.now() - startedAt > expiresIn) {
                stopWechatBindPoll();
                mask.hidden = false;
                mask.textContent = "二维码已过期，请刷新";
                hintEl.textContent = "请点击刷新二维码";
                return;
              }
              try {
                const statusBody = await api(
                  "/api/portal/wechat/scan-bind/status/?ticket=" + encodeURIComponent(wechatBindTicket)
                );
                const status = statusBody.status || "pending";
                if (status === "pending") return;
                if (status === "ok") {
                  stopWechatBindPoll();
                  me = statusBody.data || me;
                  close();
                  refreshWechatUi(options);
                  syncBindGate();
                  msgEl.textContent = "微信绑定成功。";
                  return;
                }
                if (status === "conflict") {
                  errEl.textContent = "该微信已绑定其他账号。";
                  mask.hidden = false;
                  mask.textContent = "绑定冲突";
                  return;
                }
                if (status === "expired" || status === "fail") {
                  stopWechatBindPoll();
                  mask.hidden = false;
                  mask.textContent = status === "expired" ? "二维码已过期" : "绑定失败";
                }
              } catch (_) {
                /* ignore transient poll errors */
              }
            }, 1500);
          } catch (error) {
            mask.hidden = false;
            mask.textContent = "生成失败";
            errEl.textContent = error.message || "无法生成绑定二维码";
          }
        }

        backdrop.querySelector("[data-role=refresh]").onclick = () => startBindQr();
        await startBindQr();
      }

      function syncBindGate() {
        const bound = Boolean(me.wechatBound);
        subGate.hidden = bound;
        subBody.hidden = !bound;
        if (!bound) {
          msgEl.textContent = msgEl.textContent || "请先绑定微信后再设置订阅。";
        }
      }

      function refreshWechatUi(options) {
        const bound = Boolean(me.wechatBound);
        const follow = me.wechatFollowStatus || "unknown";
        statusEl.textContent = bound
          ? `已绑定微信${follow === "unsubscribed" ? "（已取关服务号，将无法收到推送）" : "，可设置订阅并开启推送"}`
          : "尚未绑定微信。请先绑定后再设置订阅条件。";
        actionsEl.innerHTML = "";
        syncBindGate();
        if (!options?.wechatConfigured) {
          const tip = document.createElement("p");
          tip.className = "muted";
          tip.textContent = "管理员尚未配置微信服务号，绑定按钮暂不可用。";
          actionsEl.appendChild(tip);
          return;
        }
        if (!bound) {
          const bindBtn = document.createElement("button");
          bindBtn.type = "button";
          bindBtn.className = "primary";
          bindBtn.textContent = "绑定微信";
          bindBtn.onclick = async () => {
            try {
              if (isPortalH5Client()) {
                const body = await api("/api/portal/wechat/bind-url/");
                if (body.url) location.href = body.url;
                return;
              }
              await openBindQrModal(options);
            } catch (error) {
              msgEl.textContent = error.message;
            }
          };
          actionsEl.appendChild(bindBtn);
        } else {
          const unbindBtn = document.createElement("button");
          unbindBtn.type = "button";
          unbindBtn.className = "ghost";
          unbindBtn.textContent = "解除绑定";
          unbindBtn.onclick = async () => {
            try {
              const body = await api("/api/portal/wechat/unbind/", { method: "POST", body: "{}" });
              me = body.data;
              card.enabled.checked = Boolean(me.subscription?.enabled);
              refreshWechatUi(options);
              renderTabs();
              msgEl.textContent = "已解除微信绑定，推送已关闭。";
            } catch (error) {
              msgEl.textContent = error.message;
            }
          };
          actionsEl.appendChild(unbindBtn);
        }
      }

      let options = { orgTypes: [], shandongCities: SHANDONG_CITIES, wechatConfigured: false };
      try {
        if (bindStatus) {
          const latest = await api("/api/portal/me/");
          me = latest.data;
          keywords.splice(0, keywords.length, ...subscriptionKeywords(me.subscription));
          selectedCities.clear();
          subscriptionCities(me.subscription).forEach((item) => selectedCities.add(item));
          selectedOrgTypes.clear();
          (me.subscription?.orgTypes || []).forEach((item) => selectedOrgTypes.add(item));
          selectedNoticeCategories.clear();
          subscriptionNoticeCategories(me.subscription).forEach((item) => selectedNoticeCategories.add(item));
          pushTimes = subscriptionPushTimes(me.subscription);
          card.enabled.checked = Boolean(me.subscription?.enabled);
        }
        options = await api("/api/portal/subscription/options/");
      } catch (error) {
        msgEl.textContent = error.message || msgEl.textContent;
      }

      card.enabled.onchange = () => renderTabs();
      card.querySelector("[data-role=add-keyword]").onclick = addKeyword;
      card.keywordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          addKeyword();
        }
      });
      card.querySelector("[data-role=add-push-time]").onclick = () => {
        if (pushTimes.length >= 5) {
          msgEl.textContent = "推送时刻最多 5 个。";
          return;
        }
        pushTimes = validateSubscriptionPushTimes(pushTimes.concat(["18:00"])).times;
        const checked = validateSubscriptionPushTimes(pushTimes);
        msgEl.textContent = checked.error || "";
        pushTimes = checked.times;
        renderPushTimes();
        renderTabs();
      };

      const redrawOrgs = () => renderChipGroup(
        card.querySelector("#org-types"),
        options.orgTypes || [],
        [...selectedOrgTypes],
        (item) => {
          if (selectedOrgTypes.has(item)) selectedOrgTypes.delete(item);
          else selectedOrgTypes.add(item);
          redrawOrgs();
          renderTabs();
        },
      );
      redrawOrgs();
      renderCityChips(options.shandongCities && options.shandongCities.length ? options.shandongCities : SHANDONG_CITIES);
      renderNoticeCategoryChips();
      renderKeywordChips();
      renderPushTimes();
      renderTabs();
      refreshWechatUi(options);

      card.onsubmit = async (event) => {
        event.preventDefault();
        msgEl.textContent = "";
        if (!me.wechatBound) {
          msgEl.textContent = "请先绑定微信后再设置订阅。";
          syncBindGate();
          return;
        }
        const checked = validateSubscriptionPushTimes(pushTimes);
        pushTimes = checked.times;
        renderPushTimes();
        if (checked.error) {
          msgEl.textContent = checked.error;
          activeTab = "push";
          renderTabs();
          return;
        }
        const regions = [...selectedCities].map((city) => ({
          province: "山东省",
          city,
          district: "",
        }));
        try {
          const body = await api("/api/portal/subscription/", {
            method: "PUT",
            body: JSON.stringify({
              enabled: card.enabled.checked,
              keywords,
              regions,
              orgTypes: [...selectedOrgTypes],
              noticeCategories: [...selectedNoticeCategories],
              pushTimes,
              contentTags: [],
              buyers: [],
            }),
          });
          me = body.data;
          pushTimes = subscriptionPushTimes(me.subscription);
          renderPushTimes();
          messageQuery.filtersReady = false;
          messageQuery.page = 1;
          msgEl.textContent = "订阅已保存。";
          refreshWechatUi(options);
          renderTabs();
        } catch (error) {
          msgEl.textContent = error.message;
        }
      };
    }

    function renderAccount(panel) {
      panel.innerHTML = "";
      const card = document.createElement("section");
      card.className = "card account-card";
      const tags = (me.permissions || []).map((id) => PERMISSION_LABELS[id] || id);
      const sites = (me.allowedSites || []).map((site) => site.label || site.id);
      const siteText = me.siteScope === "limited" ? (sites.length ? sites.join("、") : "无平台") : "全部平台";
      card.innerHTML = '<dl class="profile"><dt>名称</dt><dd id="acc-name"></dd><dt>手机号</dt><dd id="acc-phone"></dd><dt>客户</dt><dd id="acc-customer"></dd><dt>状态</dt><dd id="acc-status"></dd><dt>可查看平台</dt><dd id="acc-sites"></dd><dt>权限</dt><dd><div class="tags" id="acc-tags"></div></dd></dl>';
      card.querySelector("#acc-name").textContent = me.name || "—";
      card.querySelector("#acc-phone").textContent = me.phone || "—";
      card.querySelector("#acc-customer").textContent = me.customerName || "—";
      card.querySelector("#acc-status").textContent = me.status || "—";
      card.querySelector("#acc-sites").textContent = siteText;
      const tagBox = card.querySelector("#acc-tags");
      if (!tags.length) tagBox.textContent = "未开通";
      tags.forEach((label) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = label;
        tagBox.appendChild(span);
      });
      panel.appendChild(card);
    }

    document.getElementById("login-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("login-error");
      error.textContent = "";
      try {
        const body = await api("/api/portal/login/", {
          method: "POST",
          body: JSON.stringify({ phone: form.phone.value.trim(), password: form.password.value }),
        });
        stopWechatScanLogin();
        if (await redirectWithHandoffIfNeeded()) return;
        showApp(body.data);
      } catch (err) {
        error.textContent = err.message;
      }
    };

    const platformLoginForm = document.getElementById("platform-login-form");
    if (platformLoginForm) {
      platformLoginForm.onsubmit = async (event) => {
        event.preventDefault();
        const form = event.target;
        const error = document.getElementById("platform-login-error");
        if (error) error.textContent = "";
        try {
          const body = await api("/api/portal/login/platform/", {
            method: "POST",
            body: JSON.stringify({
              accountName: form.accountName.value.trim(),
              password: form.password.value,
            }),
          });
          stopWechatScanLogin();
          if (await redirectWithHandoffIfNeeded()) return;
          showApp(body.data);
        } catch (err) {
          if (error) error.textContent = err.message;
        }
      };
    }

    const loginTabs = document.getElementById("login-tabs");
    if (loginTabs) {
      loginTabs.addEventListener("click", (event) => {
        const btn = event.target && event.target.closest ? event.target.closest("[data-login-tab]") : null;
        if (!btn || btn.hidden) return;
        setLoginTab(btn.getAttribute("data-login-tab") || "password");
      });
    }
    const wechatOneTap = document.getElementById("wechat-one-tap");
    if (wechatOneTap) {
      wechatOneTap.onclick = () => {
        location.href = wechatSilentLoginUrl("home");
      };
    }
    const wechatScanRefresh = document.getElementById("wechat-scan-refresh");
    if (wechatScanRefresh) {
      wechatScanRefresh.onclick = () => startWechatScanLogin();
    }

    // 登录页展示静默登录失败原因
    (() => {
      const flag = readWechatBindStatus();
      if (!flag) return;
      const map = {
        unbound: "当前微信尚未绑定账号，请先用手机号登录并在「订阅」页绑定。",
        disabled: "账号不可用，请联系管理员。",
        fail: "微信登录失败，请重试或使用手机号登录。",
      };
      const msg = map[flag];
      if (!msg) return;
      const loginError = document.getElementById("login-error");
      const wechatError = document.getElementById("wechat-scan-error");
      if (loginError) loginError.textContent = msg;
      if (wechatError) wechatError.textContent = msg;
    })();

    document.getElementById("user-trigger").onclick = (event) => {
      event.stopPropagation();
      dropdown.hidden = !dropdown.hidden;
    };
    dropdown.querySelector("[data-go=account]").onclick = () => openTab("account");
    dropdown.querySelectorAll("[data-theme-set]").forEach((button) => {
      button.onclick = (event) => {
        event.stopPropagation();
        applyPortalTheme(button.getAttribute("data-theme-set"), { refresh: true });
      };
    });
    document.getElementById("msg-bell").onclick = (event) => {
      event.stopPropagation();
      dropdown.hidden = true;
      if (!canViewMessages()) return;
      openTab("messages");
    };
    document.getElementById("logout").onclick = async () => {
      await api("/api/portal/logout/", { method: "POST", body: "{}" }).catch(() => {});
      try {
        localStorage.removeItem(TAB_STORAGE_KEY);
      } catch (_) {}
      disposeCharts();
      setMessageBadge(0);
      const bell = document.getElementById("msg-bell");
      if (bell) {
        bell.hidden = true;
        bell.classList.remove("active");
      }
      const url = new URL(location.href);
      url.search = "";
      history.replaceState(null, "", url.pathname + "#login");
      showLogin();
    };
    document.addEventListener("click", () => { dropdown.hidden = true; });
    window.addEventListener("resize", () => fitCharts());
    window.addEventListener("orientationchange", () => window.setTimeout(fitCharts, 200));
    window.addEventListener("pageshow", () => window.setTimeout(fitCharts, 50));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") window.setTimeout(fitCharts, 80);
    });
    window.addEventListener("hashchange", () => {
      if (!me) return;
      const next = readSavedTab() || "home";
      if (next !== tab) openTab(next);
    });

    function isWeChatBrowser() {
      return /MicroMessenger/i.test(navigator.userAgent || "");
    }

    function wechatSilentLoginUrl(nextTab) {
      const next = encodeURIComponent(nextTab || "messages");
      return `/api/portal/wechat/silent-login/?next=${next}`;
    }

    function shouldWechatSilentLogin() {
      if (!isWeChatBrowser()) return false;
      // 已从静默登录失败回落时不要死循环
      const flag = new URLSearchParams(location.search || "").get("wechat") || "";
      if (flag && flag !== "ok") return false;
      const hash = String(location.hash || "").replace(/^#/, "").split("?")[0];
      return hash === "messages" || hash.startsWith("messages/");
    }

    api("/api/portal/me/")
      .then(async (body) => {
        if (await redirectWithHandoffIfNeeded()) return;
        showApp(body.data);
      })
      .catch(() => {
        if (shouldWechatSilentLogin()) {
          location.replace(wechatSilentLoginUrl("messages"));
          return;
        }
        showLogin();
      });
  </script>
</body>
</html>
