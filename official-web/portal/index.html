          renderNotices(panel);
        };
      });
    }

    async function renderNotices(panel) {
      const requestId = ++noticeRequest;
      const params = new URLSearchParams({
        page: String(noticeQuery.page),
        page_size: "10",
        search: noticeQuery.search,
        siteId: noticeQuery.siteId,
        noticeKind: noticeQuery.noticeKind,
      });
      if (noticeQuery.publishDateFrom) params.set("publishDateFrom", noticeQuery.publishDateFrom);
      if (noticeQuery.publishDateTo) params.set("publishDateTo", noticeQuery.publishDateTo);
      if (!panel.querySelector(".list-card")) {
        panel.innerHTML = '<p class="panel-loading">正在加载公告列表…</p>';
      }
      const body = await api("/api/portal/notices/?" + params.toString());
      if (requestId !== noticeRequest) return;

      let toolbar = panel.querySelector(".toolbar");
      let list = panel.querySelector(".list-card");
      let pager = panel.querySelector(".pager");
      if (!toolbar || !list || !pager) {
        panel.innerHTML = "";
        toolbar = document.createElement("div");
        toolbar.className = "toolbar";
        toolbar.innerHTML =
          '<label>搜索<input name="search" placeholder="标题、项目、采购人" /></label>' +
          '<label>平台<select name="siteId"><option value="">全部</option></select></label>' +
          '<label>类型<select name="noticeKind"><option value="">全部</option></select></label>' +
          '<label>发布开始<input name="publishDateFrom" type="date" /></label>' +
          '<label>发布结束<input name="publishDateTo" type="date" /></label>' +
          '<button class="ghost" type="button" data-role="apply-dates">查询</button>' +
          '<button class="ghost" type="button" data-role="clear-dates">清空日期</button>';
        const searchInput = toolbar.querySelector("[name=search]");
        searchInput.value = noticeQuery.search;
        searchInput.oninput = (event) => {
          window.clearTimeout(noticeSearchTimer);
          const value = event.target.value.trim();
          noticeSearchTimer = window.setTimeout(() => {
            if (noticeQuery.search === value) return;
            noticeQuery.search = value;
            noticeQuery.page = 1;
            renderNotices(panel);
          }, 300);
        };
        const siteSelect = toolbar.querySelector("[name=siteId]");
        (body.sites || []).forEach((site) => {
          const option = document.createElement("option");
          option.value = site.id;
          option.textContent = site.label;
          siteSelect.appendChild(option);
        });
        siteSelect.value = noticeQuery.siteId;
        siteSelect.onchange = () => {
          noticeQuery.siteId = siteSelect.value;
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        const kindSelect = toolbar.querySelector("[name=noticeKind]");
        (body.noticeKinds || []).forEach((kind) => {
          const option = document.createElement("option");
          option.value = kind;
          option.textContent = kind;
          kindSelect.appendChild(option);
        });
        kindSelect.value = noticeQuery.noticeKind;
        kindSelect.onchange = () => {
          noticeQuery.noticeKind = kindSelect.value;
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        const fromInput = toolbar.querySelector("[name=publishDateFrom]");
        const toInput = toolbar.querySelector("[name=publishDateTo]");
        fromInput.value = noticeQuery.publishDateFrom;
        toInput.value = noticeQuery.publishDateTo;
        toolbar.querySelector("[data-role=apply-dates]").onclick = () => {
          noticeQuery.publishDateFrom = fromInput.value || "";
          noticeQuery.publishDateTo = toInput.value || "";
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        toolbar.querySelector("[data-role=clear-dates]").onclick = () => {
          fromInput.value = "";
          toInput.value = "";
          noticeQuery.publishDateFrom = "";
          noticeQuery.publishDateTo = "";
          noticeQuery.page = 1;
          renderNotices(panel);
        };
        list = document.createElement("div");
        list.className = "card list-card";
        pager = document.createElement("div");
        pager.className = "pager";
        panel.appendChild(toolbar);
        panel.appendChild(list);
        panel.appendChild(pager);
      } else {
        toolbar.querySelector("[name=publishDateFrom]").value = noticeQuery.publishDateFrom;
        toolbar.querySelector("[name=publishDateTo]").value = noticeQuery.publishDateTo;
      }
      fillNoticeList(list, body);
      fillNoticePager(pager, panel, body);
    }

    function renderChipGroup(container, items, selected, onToggle) {
      container.innerHTML = "";
      container.className = "chip-group";
      (items || []).forEach((item) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "chip" + (selected.includes(item) ? " active" : "");
        btn.textContent = item;
        btn.onclick = () => onToggle(item);
        container.appendChild(btn);
      });
    }

    async function renderSubscription(panel) {
      panel.innerHTML = "";
      const card = document.createElement("form");
      card.className = "card subscription-card";
      card.innerHTML = `
        <h3>微信推送</h3>
        <p class="muted" id="wechat-status"></p>
        <div class="row-actions" id="wechat-actions"></div>
        <h3>订阅条件</h3>
        <p class="muted">维度之间为「或」：任一维度命中即可；同一维度内多个选项也为「或」。每天汇总一条微信提醒。</p>
        <label>采购内容标签<div class="chip-group" id="content-tags"></div></label>
        <label>单位类型<div class="chip-group" id="org-types"></div></label>
        <label>地区（省）
          <select name="province">
            <option value="">不限</option>
          </select>
        </label>
        <label>地区（市，可选）<input name="city" placeholder="如：济南市" /></label>
        <label>关键词<input name="keywords" placeholder="多个词用空格或逗号分隔，匹配标题/项目名" /></label>
        <label>采购人（可多条，逗号分隔）<input name="buyers" placeholder="如：交通管理支队, 审计局" /></label>
        <label class="check-row"><input name="enabled" type="checkbox" /> 开启每日推送</label>
        <div class="row-actions"><button class="primary" type="submit">保存订阅</button></div>
        <p class="error" id="sub-msg"></p>
      `;
      panel.appendChild(card);

      const selectedTags = new Set(me.subscription?.contentTags || []);
      const selectedOrgTypes = new Set(me.subscription?.orgTypes || []);
      const region0 = (me.subscription?.regions && me.subscription.regions[0]) || {};
      card.keywords.value = me.subscription?.keywords || "";
      card.buyers.value = (me.subscription?.buyers || []).join(", ");
      card.city.value = region0.city || "";
      card.enabled.checked = Boolean(me.subscription?.enabled);

      const statusEl = card.querySelector("#wechat-status");
      const actionsEl = card.querySelector("#wechat-actions");
      const msgEl = card.querySelector("#sub-msg");
      const bindStatus = readWechatBindStatus();
      if (bindStatus === "ok") msgEl.textContent = "微信绑定成功。";
      else if (bindStatus === "fail") msgEl.textContent = "微信绑定失败，请重试。";
      else if (bindStatus === "conflict") msgEl.textContent = "该微信已绑定其他账号。";
      if (bindStatus) clearWechatBindStatusFromUrl();

      function refreshWechatUi(options) {
        const bound = Boolean(me.wechatBound);
        const follow = me.wechatFollowStatus || "unknown";
        statusEl.textContent = bound
          ? `已绑定微信${follow === "unsubscribed" ? "（已取关服务号，将无法收到推送）" : "，可开启每日汇总推送"}`
          : "尚未绑定微信。开启推送前请先关注服务号并完成绑定。";
        actionsEl.innerHTML = "";
        if (!options?.wechatConfigured) {
          const tip = document.createElement("p");
          tip.className = "muted";
          tip.textContent = "管理员尚未配置微信服务号，绑定按钮暂不可用。";
          actionsEl.appendChild(tip);
          return;
        }
        if (!bound) {
          const bindBtn = document.createElement("button");
          bindBtn.type = "button";
          bindBtn.className = "primary";
          bindBtn.textContent = "绑定微信";
          bindBtn.onclick = async () => {
            try {
              const body = await api("/api/portal/wechat/bind-url/");
              if (body.url) location.href = body.url;
            } catch (error) {
              msgEl.textContent = error.message;
            }
          };
          actionsEl.appendChild(bindBtn);
        } else {
          const unbindBtn = document.createElement("button");
          unbindBtn.type = "button";
          unbindBtn.className = "ghost";
          unbindBtn.textContent = "解除绑定";
          unbindBtn.onclick = async () => {
            try {
              const body = await api("/api/portal/wechat/unbind/", { method: "POST", body: "{}" });
              me = body.data;
              card.enabled.checked = Boolean(me.subscription?.enabled);
              refreshWechatUi(options);
              msgEl.textContent = "已解除微信绑定，推送已关闭。";
            } catch (error) {
              msgEl.textContent = error.message;
            }
          };
          actionsEl.appendChild(unbindBtn);
        }
      }

      let options = { contentTags: [], orgTypes: [], provinces: [], wechatConfigured: false };
      try {
        if (bindStatus) {
          const latest = await api("/api/portal/me/");
          me = latest.data;
        }
        options = await api("/api/portal/subscription/options/");
      } catch (error) {
        msgEl.textContent = error.message || msgEl.textContent;
      }

      const provinceSelect = card.province;
      (options.provinces || []).forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        provinceSelect.appendChild(opt);
      });
      provinceSelect.value = region0.province || "";

      const redrawTags = () => renderChipGroup(
        card.querySelector("#content-tags"),
        options.contentTags || [],
        [...selectedTags],
        (item) => {
          if (selectedTags.has(item)) selectedTags.delete(item);
          else selectedTags.add(item);
          redrawTags();
        },
      );
      const redrawOrgs = () => renderChipGroup(
        card.querySelector("#org-types"),
        options.orgTypes || [],
        [...selectedOrgTypes],
        (item) => {
          if (selectedOrgTypes.has(item)) selectedOrgTypes.delete(item);
          else selectedOrgTypes.add(item);
          redrawOrgs();
        },
      );
      redrawTags();
      redrawOrgs();
      refreshWechatUi(options);

      card.onsubmit = async (event) => {
        event.preventDefault();
        msgEl.textContent = "";
        const buyers = String(card.buyers.value || "")
          .split(/[\s,，;；]+/)
          .map((item) => item.trim())
          .filter(Boolean);
        const regions = [];
        if (provinceSelect.value || card.city.value.trim()) {
          regions.push({
            province: provinceSelect.value || "",
            city: card.city.value.trim(),
            district: "",
          });
        }
        try {
          const body = await api("/api/portal/subscription/", {
            method: "PUT",
            body: JSON.stringify({
              enabled: card.enabled.checked,
              keywords: card.keywords.value,
              contentTags: [...selectedTags],
              orgTypes: [...selectedOrgTypes],
              buyers,
              regions,
            }),
          });
          me = body.data;
          msgEl.textContent = "订阅已保存。";
          refreshWechatUi(options);
        } catch (error) {
          msgEl.textContent = error.message;
        }
      };
    }

    function renderAccount(panel) {
      panel.innerHTML = "";
      const card = document.createElement("section");
      card.className = "card account-card";
      const tags = (me.permissions || []).map((id) => PERMISSION_LABELS[id] || id);
      const sites = (me.allowedSites || []).map((site) => site.label || site.id);
      const siteText = me.siteScope === "limited" ? (sites.length ? sites.join("、") : "无平台") : "全部平台";
      card.innerHTML = '<dl class="profile"><dt>名称</dt><dd id="acc-name"></dd><dt>手机号</dt><dd id="acc-phone"></dd><dt>客户</dt><dd id="acc-customer"></dd><dt>状态</dt><dd id="acc-status"></dd><dt>可查看平台</dt><dd id="acc-sites"></dd><dt>权限</dt><dd><div class="tags" id="acc-tags"></div></dd></dl>';
      card.querySelector("#acc-name").textContent = me.name || "—";
      card.querySelector("#acc-phone").textContent = me.phone || "—";
      card.querySelector("#acc-customer").textContent = me.customerName || "—";
      card.querySelector("#acc-status").textContent = me.status || "—";
      card.querySelector("#acc-sites").textContent = siteText;
      const tagBox = card.querySelector("#acc-tags");
      if (!tags.length) tagBox.textContent = "未开通";
      tags.forEach((label) => {
        const span = document.createElement("span");
        span.className = "tag";
        span.textContent = label;
        tagBox.appendChild(span);
      });
      panel.appendChild(card);
    }

    document.getElementById("login-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("login-error");
      error.textContent = "";
      try {
        const body = await api("/api/portal/login/", {
          method: "POST",
          body: JSON.stringify({ phone: form.phone.value.trim(), password: form.password.value }),
        });
        showApp(body.data);
      } catch (err) {
        error.textContent = err.message;
      }
    };

    document.getElementById("user-trigger").onclick = (event) => {
      event.stopPropagation();
      dropdown.hidden = !dropdown.hidden;
    };
    dropdown.querySelector("[data-go=account]").onclick = () => openTab("account");
    document.getElementById("msg-bell").onclick = (event) => {
      event.stopPropagation();
      dropdown.hidden = true;
      if (!canViewMessages()) return;
      openTab("messages");
    };
    document.getElementById("logout").onclick = async () => {
      await api("/api/portal/logout/", { method: "POST", body: "{}" }).catch(() => {});
      disposeCharts();
      setMessageBadge(0);
      const bell = document.getElementById("msg-bell");
      if (bell) {
        bell.hidden = true;
        bell.classList.remove("active");
      }
      showLogin();
    };
    document.addEventListener("click", () => { dropdown.hidden = true; });
    window.addEventListener("resize", () => fitCharts());
    window.addEventListener("orientationchange", () => window.setTimeout(fitCharts, 200));
    window.addEventListener("pageshow", () => window.setTimeout(fitCharts, 50));
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") window.setTimeout(fitCharts, 80);
    });
    window.addEventListener("hashchange", () => {
      if (!me) return;
      const next = readSavedTab() || "home";
      if (next !== tab) openTab(next);
    });

    api("/api/portal/me/")
      .then((body) => showApp(body.data))
      .catch(() => showLogin());
  </script>
</body>
</html>
