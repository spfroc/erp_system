<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>客户控制台</title>
  <style>
    :root { color-scheme: light; --green: #0f7a4a; --ink: #1c2b24; --muted: #5d6b64; --line: #d7e3dc; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Segoe UI", "PingFang SC", sans-serif; background: #f4f7f5; color: var(--ink); }
    header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid var(--line); }
    main { max-width: 880px; margin: 32px auto; padding: 0 16px; }
    h1 { font-size: 20px; margin: 0; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
    label { display: block; margin-bottom: 12px; font-size: 14px; }
    input { width: 100%; margin-top: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    button { background: var(--green); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; cursor: pointer; }
    button.ghost { background: transparent; color: var(--green); border: 1px solid var(--green); }
    .error { color: #a12626; min-height: 1.2em; }
    .tabs { display: flex; gap: 8px; margin: 16px 0; }
    .tabs button.active { outline: 2px solid var(--green); }
    article { padding: 12px 0; border-bottom: 1px solid var(--line); }
    article h2 { font-size: 16px; margin: 0 0 4px; }
    article p { margin: 0; color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>客户控制台</h1>
    <button id="logout" class="ghost" type="button" hidden>退出</button>
  </header>
  <main>
    <section id="login" class="card">
      <h2>登录</h2>
      <p>使用管理员发放的客户账号。这里与员工后台无关。</p>
      <form id="login-form">
        <label>手机号<input name="phone" autocomplete="username" required /></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="error" id="login-error"></p>
        <button type="submit">登录</button>
      </form>
    </section>
    <section id="home" hidden>
      <p id="welcome"></p>
      <div class="tabs" id="tabs"></div>
      <div id="panel" class="card"></div>
    </section>
  </main>
  <script>
    const loginBox = document.getElementById("login");
    const home = document.getElementById("home");
    const logout = document.getElementById("logout");
    let me = null;

    async function api(path, options) {
      const response = await fetch(path, { credentials: "include", headers: { "Content-Type": "application/json" }, ...options });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || "请求失败");
      return body;
    }

    function showHome(account) {
      me = account;
      loginBox.hidden = true;
      home.hidden = false;
      logout.hidden = false;
      document.getElementById("welcome").textContent = (account.customerName || account.name) + " · " + account.phone;
      const tabs = [];
      if (account.permissions.includes("portal.notice.view")) tabs.push(["notices", "公告"]);
      if (account.permissions.includes("portal.notice.subscribe")) tabs.push(["subscription", "订阅"]);
      if (account.permissions.includes("portal.stats.view")) tabs.push(["stats", "数据统计"]);
      const tabBar = document.getElementById("tabs");
      tabBar.innerHTML = "";
      if (!tabs.length) {
        document.getElementById("panel").textContent = "当前账号还没有可查看的内容，请联系管理员开通权限。";
        return;
      }
      tabs.forEach(([id, label], index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = label;
        button.className = index === 0 ? "active" : "";
        button.onclick = () => {
          tabBar.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          openTab(id);
        };
        tabBar.appendChild(button);
      });
      openTab(tabs[0][0]);
    }

    async function openTab(id) {
      const panel = document.getElementById("panel");
      panel.textContent = "加载中…";
      if (id === "notices") {
        const body = await api("/api/portal/notices/?page=1&page_size=20");
        panel.innerHTML = "";
        if (!body.items.length) panel.textContent = "暂无已公开公告。";
        body.items.forEach((item) => {
          const article = document.createElement("article");
          article.innerHTML = "<h2></h2><p></p>";
          article.querySelector("h2").textContent = item.title || "未命名公告";
          article.querySelector("p").textContent = [item.siteLabel, item.noticeKind, item.progressLabel, item.publishTime].filter(Boolean).join(" · ");
          panel.appendChild(article);
        });
        return;
      }
      if (id === "stats") {
        const body = await api("/api/portal/stats/");
        panel.innerHTML = "";
        const text = document.createElement("p");
        text.textContent = "已抓取公告 " + body.data.publicNoticeTotal + " 条。订阅" + (body.data.subscriptionEnabled ? "已开启" : "未开启") + "。";
        panel.appendChild(text);
        return;
      }
      panel.innerHTML = "";
      const form = document.createElement("form");
      form.innerHTML = '<label>关键词<input name="keywords" /></label><label><input name="enabled" type="checkbox" /> 接收订阅消息</label><button type="submit">保存</button><p class="error"></p>';
      form.keywords.value = me.subscription?.keywords || "";
      form.enabled.checked = Boolean(me.subscription?.enabled);
      form.onsubmit = async (event) => {
        event.preventDefault();
        try {
          const body = await api("/api/portal/subscription/", {
            method: "PUT",
            body: JSON.stringify({ keywords: form.keywords.value, enabled: form.enabled.checked }),
          });
          me = body.data;
          form.querySelector(".error").textContent = "已保存。短信发送后续开通。";
        } catch (error) {
          form.querySelector(".error").textContent = error.message;
        }
      };
      panel.appendChild(form);
    }

    document.getElementById("login-form").onsubmit = async (event) => {
      event.preventDefault();
      const form = event.target;
      const error = document.getElementById("login-error");
      error.textContent = "";
      try {
        const body = await api("/api/portal/login/", {
          method: "POST",
          body: JSON.stringify({ phone: form.phone.value, password: form.password.value }),
        });
        showHome(body.data);
      } catch (err) {
        error.textContent = err.message;
      }
    };
    logout.onclick = async () => {
      await api("/api/portal/logout/", { method: "POST", body: "{}" });
      location.reload();
    };
    api("/api/portal/me/").then((body) => showHome(body.data)).catch(() => {});
  </script>
</body>
</html>
