# 仅部署公告抓取（不依赖 Traefik 外部网络 prod.host）
# 用法：
#   docker compose -f deploy/docker-compose.prod.crawler.yml up -d --build
x-tz: &default-tz
  TZ: Asia/Shanghai

services:
  notice-crawler:
    build:
      context: ../notice_crawler
    container_name: yzc-erp-notice-crawler-prod
    restart: unless-stopped
    # 宿主机网络：才能访问内网 SOCKS（192.168.0.19），绕过公网对山东商城的封锁
    network_mode: host
    env_file:
      - ../.env.prod
    environment:
      <<: *default-tz
      NOTICE_HTTP_PROXY: socks5h://192.168.0.19:19081
      HTTPS_PROXY: socks5h://192.168.0.19:19081
      HTTP_PROXY: socks5h://192.168.0.19:19081
      ALL_PROXY: socks5h://192.168.0.19:19081
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
    volumes:
      - notice-crawler-data:/app/data
      - ../notice_crawler/models:/app/models:ro
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro

volumes:
  notice-crawler-data:
    name: yzc-erp.notice-crawler-data
