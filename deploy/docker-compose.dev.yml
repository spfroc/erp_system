services:
  frontend:
    build:
      context: ../frontend
    working_dir: /app
    command: sh -c "test -d node_modules && npm run dev || (npm install && npm run dev)"
    environment:
      VITE_BACKEND_PORT: "18080"
      VITE_OCR_PORT: "18081"
    ports:
      - "18082:5173"
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: ../backend
    working_dir: /app
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-change-me
      DJANGO_ALLOWED_HOSTS: "*"
      CORS_ALLOW_ALL_ORIGINS: "1"
      MYSQL_DATABASE: yicai_erp
      MYSQL_USER: yicai
      MYSQL_PASSWORD: yicai
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_URL: redis://redis:6379/0
      OCR_SERVICE_URL: http://ocr-service:8100
    ports:
      - "18080:8000"
    volumes:
      - ../backend:/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      ocr-service:
        condition: service_started

  ocr-service:
    build:
      context: ../ocr-service
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8100 --reload
    ports:
      - "18081:8100"
    volumes:
      - ../ocr-service:/app

  notice-crawler:
    build:
      context: ../notice_crawler
    working_dir: /app
    restart: unless-stopped
    env_file:
      - ../notice_crawler/.env
    environment:
      TZ: Asia/Shanghai
      NOTICE_DB_URL: mysql+pymysql://root:yicai-root@mysql:3306/yicai_erp?charset=utf8mb4
      EXTRACTOR_BACKEND: heuristic
      CRAWL_INTERVAL_SECONDS: "10800"
      CRAWL_STOP_DUP: "5"
      CRAWL_LOOKBACK_DAYS: "2"
    volumes:
      - notice_crawler_data:/app/data
      - /usr/share/zoneinfo/Asia/Shanghai:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0.21
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_DATABASE: yicai_erp
      MYSQL_USER: yicai
      MYSQL_PASSWORD: yicai
      MYSQL_ROOT_PASSWORD: yicai-root
    ports:
      - "13306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "16379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yicai
      MINIO_ROOT_PASSWORD: yicai123456
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data

volumes:
  frontend_node_modules:
  mysql_data:
  minio_data:
  notice_crawler_data:
